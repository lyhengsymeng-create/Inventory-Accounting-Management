<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Be Verified</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-blue: #2952e3;
    --brand-blue-dark: #1f3fc0;
    --panel-bg: #f0f1f5;
  }
  body{
    font-family: 'Poppins', sans-serif;
    background: var(--panel-bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .auth-card{
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 30px 60px rgba(20,30,80,0.12);
    overflow: hidden;
    max-width: 1000px;
    width: 100%;
  }
  .auth-visual{
    background: linear-gradient(160deg, var(--brand-blue), var(--brand-blue-dark));
    border-radius: 18px;
    position: relative;
    min-height: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    margin: 16px;
    overflow: hidden;
  }
  .auth-visual .deco-circle{
    position: absolute;
    border-radius: 50%;
  }
  .circle-yellow{ width: 90px; height: 90px; background: #ffd23f; right: 30px; top: 55%; }
  .circle-orange{ width: 60px; height: 60px; background: #ff9a3d; left: -20px; top: 58%; }
  .dot-red{ width: 10px; height: 10px; background: #ff5252; border-radius: 50%; position: absolute; top: 22%; right: 30%; box-shadow: 10px 14px 0 -2px #ff5252, -6px 18px 0 -3px #ff5252; }
  .id-card{
    background: #fff;
    width: 260px;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    transform: rotate(-6deg);
    position: relative;
    z-index: 2;
  }
  .id-dot{
    width: 16px; height: 16px; background: #f1f1f1; border-radius: 50%;
    position: absolute; top: -8px; left: 24px;
  }
  .id-row{ display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .id-avatar{
    width: 34px; height: 34px; border-radius: 50%;
    background: #ffc857; display:flex; align-items:center; justify-content:center;
    font-size: 16px; flex-shrink: 0;
  }
  .id-lines{ flex: 1; }
  .id-lines span{
    display:block; height: 6px; background: #e6e6ee; border-radius: 4px; margin-bottom: 6px;
  }
  .id-lines span:nth-child(1){ width: 100%; }
  .id-lines span:nth-child(2){ width: 70%; }
  .visual-heading{
    font-family: 'Courier Prime', monospace;
    color: #fff;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: 1px;
    margin-top: 36px;
  }
  .visual-sub{
    font-family: 'Courier Prime', monospace;
    color: rgba(255,255,255,0.85);
    text-align: center;
    font-size: 0.85rem;
    max-width: 260px;
    margin-top: 10px;
    line-height: 1.5;
  }
  .form-side{
    padding: 56px 60px;
  }
  .form-side h1{
    font-weight: 700;
    font-size: 2.1rem;
    margin-bottom: 6px;
    color: #111827;
  }
  .form-side p.lead-text{
    color: #6b7280;
    margin-bottom: 32px;
  }
  .form-control{
    background: #f5f6fa;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 0.95rem;
  }
  .form-control:focus{
    background: #fff;
    border-color: var(--brand-blue);
    box-shadow: 0 0 0 3px rgba(41,82,227,0.12);
  }
  .form-check-input:checked{
    background-color: var(--brand-blue);
    border-color: var(--brand-blue);
  }
  a.link-forgot{
    color: var(--brand-blue);
    font-weight: 500;
    text-decoration: underline;
  }
  .btn-login{
    background: var(--brand-blue);
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-weight: 600;
    font-size: 1rem;
    color: #fff;
  }
  .btn-login:hover{
    background: var(--brand-blue-dark);
    color: #fff;
  }
  .btn-google{
    background: #f5f6fa;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 13px;
    font-weight: 500;
    color: #374151;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-google:hover{
    background: #eceef3;
    color: #374151;
  }
  .signup-text a{
    color: var(--brand-blue);
    font-weight: 600;
    text-decoration: underline;
  }
  @media (max-width: 767px){
    .auth-visual{ min-height: 320px; margin: 12px; padding: 24px; }
    .form-side{ padding: 32px 28px; }
    .id-card{ width: 200px; }
  }
  .alert-demo{
    border-radius: 10px;
    font-size: 0.88rem;
    padding: 10px 14px;
  }
  .hidden{ display:none !important; }
  .welcome-box{
    text-align:center;
    padding: 60px 20px;
  }
  .welcome-box .check-circle{
    width:70px;height:70px;border-radius:50%;
    background:#e8f5e9;color:#2e7d32;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;margin:0 auto 20px;
  }
  .btn-link-switch{
    background:none;border:none;color:var(--brand-blue);
    font-weight:600;text-decoration:underline;padding:0;
  }
</style>
</head>
<body>
<div class="auth-card">
  <div class="row g-0 align-items-stretch">

    <div class="col-md-5">
      <div class="auth-visual">
        <div class="dot-red"></div>
        <div class="circle-orange"></div>
        <div class="circle-yellow"></div>

        <div class="id-card">
          <div class="id-dot"></div>
          <div class="id-row">
            <div class="id-avatar">🧑</div>
            <div class="id-lines"><span></span><span></span></div>
          </div>
          <div class="id-row">
            <div class="id-avatar">🧑</div>
            <div class="id-lines"><span></span><span></span></div>
          </div>
          <div class="id-row" style="margin-bottom:0;">
            <div class="id-avatar">🧑</div>
            <div class="id-lines"><span></span><span></span></div>
          </div>
        </div>

        <div class="visual-heading">Be Verified</div>
        <div class="visual-sub">Join experienced Designers on this platform.</div>
      </div>
    </div>
    <div class="col-md-7">
      <div class="form-side">
        <!-- LOGIN VIEW -->
        <div id="loginView">
          <h1 class=" text-center mb-4">Login</h1>
          <div id="loginAlert" class="alert alert-demo hidden mb-3"></div>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <input type="email" class="form-control" id="loginEmail" placeholder="Email address" required>
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember Me</label>
              </div>
              <a href="#" class="link-forgot">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-login w-100 mb-3">Login</button>
            <button type="button" class="btn btn-google w-100 mb-4">
              <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.68-3.87 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
              Sign In with Google
            </button>
            <p class="text-center signup-text mb-0">Don't have account?
              <button type="button" class="btn-link-switch" id="showSignup">Sign Up</button>
            </p>
          </form>
          <p class="text-center text-muted mt-4" style="font-size:0.8rem;">
            Demo account &mdash; email: <strong>demo@example.com</strong>, password: <strong>demo1234</strong>
          </p>
        </div>

        <!-- SIGNUP VIEW -->
        <div id="signupView" class="hidden">
          <h1>Create Account</h1>
          <p class="lead-text">Join and get verified in seconds.</p>

          <div id="signupAlert" class="alert alert-demo hidden mb-3"></div>
          <form  action="../../index.html" onsubmit="return true";>
            <div class="mb-3">
              <input type="text" class="form-control" id="signupName" placeholder="Full name" required>
            </div>
            <div class="mb-3">
              <input type="email" class="form-control" id="signupEmail" placeholder="Email address" required>
            </div>
            <div class="mb-4">
              <input type="password" class="form-control" id="signupPassword" placeholder="Password (min 6 characters)" required>
            </div>
            <button type="submit" class="btn btn-login w-100 mb-3">Sign Up</button>
            <p class="text-center signup-text mb-0">Already have an account?
              <button type="button" class="btn-link-switch" id="showLogin">Login</button>
            </p>
          </form>
        </div>
       

      </div>
    </div>

  </div>
</div>
<script>
  // Path to customer/index.html, relative to customer/asset/form/login.html
  const REDIRECT_PATH = '../../index.html';

  // In-memory fake user store (demo only — resets on page reload, no real backend)
  const users = [
    { name: "Demo User", email: "demo@example.com", password: "demo1234" }
  ];

  const loginView = document.getElementById('loginView');
  const signupView = document.getElementById('signupView');

  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const loginAlert = document.getElementById('loginAlert');
  const signupAlert = document.getElementById('signupAlert');

  function showAlert(el, message, type){
    el.textContent = message;
    el.className = 'alert alert-demo mb-3 alert-' + type;
  }

  function switchView(view){
    [loginView, signupView].forEach(v => v.classList.add('hidden'));
    view.classList.remove('hidden');
  }

  document.getElementById('showSignup').addEventListener('click', () => switchView(signupView));
  document.getElementById('showLogin').addEventListener('click', () => switchView(loginView));
  function startSession(name, email){
    sessionStorage.setItem('demoUser', JSON.stringify({ name, email }));
  }

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;

    const user = users.find(u => u.email.toLowerCase() === email && u.password === password);

    if (user) {
      startSession(user.name, user.email);
      window.location.href = REDIRECT_PATH;   // -> customer/index.html
    } else {
      showAlert(loginAlert, 'Incorrect email or password. Try the demo account below, or sign up.', 'danger');
    }
  });

  signupForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim().toLowerCase();
    const password = document.getElementById('signupPassword').value;

    if (!name || !email || !password) {
      showAlert(signupAlert, 'Please fill in all fields.', 'danger');
      return;
    }
    if (password.length < 6) {
      showAlert(signupAlert, 'Password must be at least 6 characters.', 'danger');
      return;
    }
    if (users.some(u => u.email.toLowerCase() === email)) {
      showAlert(signupAlert, 'An account with that email already exists.', 'danger');
      return;
    }
    users.push({ name, email, password });
    startSession(name, email);
    window.location.href = REDIRECT_PATH;   // -> customer/index.html
  });
</script>
</body>
</html>
